name: Update publications from ORCID

on:
  schedule:
    # Every 4 months: Jan 1, May 1, Sep 1 at 06:00 UTC.
    - cron: "0 6 1 1,5,9 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ORCID works and update index.html
        run: python scripts/update_publications.py

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Nikolaos Boumparis, PhD"
            git config user.email "167476703+NikoBoumparis@users.noreply.github.com"
            git add index.html
            git commit -m "Add new publications from ORCID"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        if: steps.commit.outputs.changed == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notify_email.py
