name: Update publications from ORCID

on:
  schedule:
    # Quarterly update: Jan 1, Apr 1, Jul 1, Oct 1 at 06:00 UTC.
    - cron: "0 6 1 1,4,7,10 *"

    # Monthly keepalive on the 15th. GitHub disables schedules after 60 days without commits.
    - cron: "0 6 15 * *"

  # Editing this workflow or the update script runs it once.
  push:
    branches: [main]
    paths:
      - .github/workflows/update-publications.yml
      - scripts/update_publications.py

  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test notification email (does not touch index.html) to verify Gmail secrets"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-publications:
    if: github.event.schedule != '0 6 15 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ORCID works and update index.html
        if: github.event.inputs.test_email != 'true'
        run: python scripts/update_publications.py

      - name: Commit and push if changed
        id: commit
        if: github.event.inputs.test_email != 'true'
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Nikolaos Boumparis, PhD"
            git config user.email "167476703+NikoBoumparis@users.noreply.github.com"
            git add index.html
            git commit -m "Add new publications from ORCID"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write dummy entry for test email
        if: github.event.inputs.test_email == 'true'
        run: |
          cat > scripts/new_entries.json <<'EOF'
          [{"title": "Test Paper (this is only a test email, nothing was added to the site)", "year": "2026", "journal": "Test Journal", "doi_url": "https://doi.org/10.0000/test"}]
          EOF

      - name: Send notification email
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.test_email == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notify_email.py

  keepalive:
    if: github.event.schedule == '0 6 15 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Commits only when the repo has been quiet for 25+ days, so the gap never reaches 60.
      - name: Push empty commit if repo is idle
        run: |
          last=$(git log -1 --format=%ct)
          idle_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Days since last commit: $idle_days"
          if [ "$idle_days" -ge 25 ]; then
            git config user.name "Nikolaos Boumparis, PhD"
            git config user.email "167476703+NikoBoumparis@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive for scheduled publications workflow"
            git push
          fi
